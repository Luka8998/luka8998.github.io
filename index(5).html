<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Test Site</title>

<!-- Google Analytics: replace G-XXXXXXXXXX with your Measurement ID (both places) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX');
</script>

<style>
  body { font-family: system-ui, sans-serif; margin: 0; line-height: 1.6; color: #222; }
  nav { background: #222; padding: 0 16px; }
  nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; }
  nav li { position: relative; }
  nav a { display: block; padding: 14px 12px; color: #fff; text-decoration: none; }
  nav a:hover { background: #444; }
  .submenu { display: none; position: absolute; top: 100%; left: 0; background: #333; flex-direction: column; min-width: 160px; z-index: 10; }
  nav li:hover > .submenu, nav li:focus-within > .submenu { display: flex; }
  main { max-width: 600px; margin: 40px auto; padding: 0 16px; }
  section { margin-bottom: 40px; }
  button { background: #4f46e5; color: #fff; border: 0; padding: 10px 16px; border-radius: 6px; cursor: pointer; margin: 4px 4px 4px 0; font-size: 15px; }
  input, select, textarea { display: block; width: 100%; padding: 8px; margin: 4px 0 12px; border: 1px solid #ccc; border-radius: 6px; font: inherit; box-sizing: border-box; }
  #thanks { color: green; display: none; }
</style>
</head>
<body>

<nav>
  <ul>
    <li><a href="#home">Home</a></li>
    <li>
      <a href="#products">Products ▾</a>
      <ul class="submenu">
        <li><a href="#basic">Basic Plan</a></li>
        <li><a href="#pro">Pro Plan</a></li>
        <li><a href="#enterprise">Enterprise</a></li>
      </ul>
    </li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<main>
  <section id="home">
    <h1>Hello 👋</h1>
    <p>A simple test site for Google Analytics.</p>
  </section>

  <section id="products">
    <h2>Products</h2>
    <button onclick="track('click_basic')">Choose Basic</button>
    <button onclick="track('click_pro')">Choose Pro</button>
    <button onclick="track('click_enterprise')">Contact Sales</button>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <form id="form">
      <label>Name <input name="name" required></label>
      <label>Email <input name="email" type="email" required></label>
      <label>Interested in
        <select name="plan"><option>Basic</option><option>Pro</option><option>Enterprise</option></select>
      </label>
      <label>Message <textarea name="message" rows="3"></textarea></label>
      <button type="submit">Send</button>
    </form>
    <p id="thanks">Thanks! (Nothing was actually sent.)</p>
  </section>
</main>

<script>
  // Sends a custom event to Google Analytics
  function track(name, params) {
    gtag('event', name, params || {});
  }

  // Track submenu / nav clicks
  document.querySelectorAll('nav a').forEach(a => {
    a.addEventListener('click', () => track('menu_click', { item: a.textContent.replace('▾', '').trim() }));
  });

  // Track form submission (only the plan, no personal info)
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    track('form_submit', { plan: e.target.plan.value });
    e.target.reset();
    document.getElementById('thanks').style.display = 'block';
  });
</script>
</body>
</html>
